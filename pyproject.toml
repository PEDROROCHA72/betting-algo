[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betting-algo"
version = "0.1.0"
description = "Ferramenta de análise de value bets no futebol (contexto Betclic Portugal) — apenas análise."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro Rocha" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
betting-algo = "betting_algo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["betting_algo*"]

[tool.setuptools.package-data]
betting_algo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
